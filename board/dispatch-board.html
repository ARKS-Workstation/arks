<title>Frontline Dispatch Board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Naskh+Arabic:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF2F0; --surface:#FFF; --surface-2:#E4EAE8; --sunk:#F6F8F7;
  --ink:#101E24; --ink-2:#3D545D; --ink-3:#6E8489; --line:#D2DCD9; --line-2:#BECBC7;
  --accent:#0E4C5A; --accent-ink:#0E4C5A; --accent-soft:#DAE9EB;
  --good:#2A7355; --warn:#976008; --crit:#A2382A;
  --p1:#0E4C5A; --p2:#2A7355; --p3:#9E4E2B; --p4:#76642A;
  --shadow:0 1px 2px rgba(16,30,36,.06),0 6px 18px -8px rgba(16,30,36,.14);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --ui-ar:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --read-ar:"Noto Naskh Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1417; --surface:#131F23; --surface-2:#1A272C; --sunk:#0F1A1E;
  --ink:#E3ECEA; --ink-2:#A2B7BB; --ink-3:#728A90; --line:#243439; --line-2:#31454B;
  --accent:#5DB4C4; --accent-ink:#8FD0DB; --accent-soft:#14313A;
  --good:#5CBC8F; --warn:#D3993D; --crit:#DE6E5C;
  --p1:#5DB4C4; --p2:#5CBC8F; --p3:#D08A62; --p4:#C2AF5E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0B1417; --surface:#131F23; --surface-2:#1A272C; --sunk:#0F1A1E;
  --ink:#E3ECEA; --ink-2:#A2B7BB; --ink-3:#728A90; --line:#243439; --line-2:#31454B;
  --accent:#5DB4C4; --accent-ink:#8FD0DB; --accent-soft:#14313A;
  --good:#5CBC8F; --warn:#D3993D; --crit:#DE6E5C;
  --p1:#5DB4C4; --p2:#5CBC8F; --p3:#D08A62; --p4:#C2AF5E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.018em;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:1220px;margin:0 auto;padding:0 24px 96px}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1220px;margin:0 auto;padding:12px 24px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-size:17px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.tab{font-size:13px;font-weight:500;padding:6px 11px;border-radius:6px;color:var(--ink-2)}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .tab[aria-selected="true"],
:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0B1417}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tab[aria-selected="true"]{color:#fff}}

/* ---------- generic ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sec{padding-top:34px}
.sec-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:24px}
.sec-head p{color:var(--ink-2);font-size:14px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- today ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.today-grid{grid-template-columns:1fr}}
.hero{padding:26px 28px;position:relative;overflow:hidden}
.hero .day-badge{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.hero h3{font-size:30px;line-height:1.15;margin:10px 0 12px}
.meterbox{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.meter{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:4px}
.ticks{display:flex;gap:3px;flex-wrap:wrap}
.ticks i{width:15px;height:7px;border-radius:2px;background:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.metric{padding:16px 18px}
.metric .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.metric .v{font-family:var(--display);font-size:28px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.setup{padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.setup label{font-size:13px;color:var(--ink-2)}
input[type=date]{font:inherit;font-family:var(--mono);font-size:13px;padding:7px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--sunk);color:var(--ink)}

/* ---------- post cards ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line-2);border-radius:20px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.post{border-inline-start:3px solid var(--pc);padding:14px 16px;text-align:left;width:100%;display:block;transition:border-color .15s,transform .12s}
.post:hover{transform:translateY(-1px)}
.post.done{opacity:.62}
.post-top{display:flex;gap:10px;align-items:baseline;margin-bottom:7px}
.post-n{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--pc);font-variant-numeric:tabular-nums}
.post-day{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-inline-start:auto}
.post h4{font-size:15.5px;line-height:1.3;letter-spacing:-.012em;margin-bottom:9px}
.post-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.gaps{margin-inline-start:auto;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent-ink)}
.gaps.zero{background:transparent;color:var(--good)}

/* ---------- detail ---------- */
.detail{padding:22px 24px;margin-bottom:14px;border-inline-start:3px solid var(--pc)}
.detail-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.detail h3{font-size:21px;line-height:1.22;flex:1}
.copyblock{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-family:var(--read);font-size:16.5px;line-height:1.62;white-space:pre-wrap;color:var(--ink)}
.copyblock .ph{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit);border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:.82em;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{font-size:13px;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0B1417}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{opacity:.88;color:var(--surface)}
:root[data-theme="dark"] .btn.primary:hover{color:#0B1417}
.count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-inline-start:auto}
.count.warn{color:var(--warn)}.count.over{color:var(--crit);font-weight:500}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;margin-top:14px;font-size:13.5px;align-items:start}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.kv dd{margin:0;color:var(--ink-2)}
.tl dt{text-align:start}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:7px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- checklist ---------- */
.check{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.check:last-child{border-bottom:0}
.check input{margin:4px 0 0;accent-color:var(--accent);width:15px;height:15px;flex:none}
.check.on span{color:var(--ink-3);text-decoration:line-through}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.pad{padding:20px 22px}
.pad h4{font-size:16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:7px;padding:12px 15px;border-inline-start:3px solid var(--accent)}
.rationale{font-size:13.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rationale b{color:var(--ink);font-weight:600}
.tl{display:grid;grid-template-columns:74px 1fr;gap:0 16px}
.tl dt{font-family:var(--mono);font-size:12px;color:var(--accent-ink);padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tl dd{margin:0;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.tl dt:first-of-type,.tl dd:first-of-type{border-top:0}

/* ---------- bilingual + editing ---------- */
:root[dir=rtl] body{font-family:var(--ui-ar)}
[dir=rtl] .copyblock,[dir=rtl] .ed{font-family:var(--read-ar);line-height:1.85}
.ar{font-family:var(--ui-ar)}
.lang{display:flex;gap:2px;border:1px solid var(--line-2);border-radius:7px;padding:2px}
.lang button{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:4px 10px;border-radius:5px;color:var(--ink-2)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--surface)}
:root[data-theme=dark] .lang button[aria-pressed=true],:root:not([data-theme=light]) .lang button[aria-pressed=true]{color:#0B1417}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .lang button[aria-pressed=true]{color:#fff}}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:800px){.bi{grid-template-columns:1fr}}
.pane{min-width:0}
.pane-label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.pane-label b{color:var(--accent-ink);font-weight:500}
.ed{display:block;width:100%;min-height:260px;font-family:var(--read);font-size:16.5px;line-height:1.62;padding:17px 19px;border:1px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.ed.short{min-height:88px;font-family:var(--ui);font-size:14.5px}
.empty{background:var(--sunk);border:1px dashed var(--line-2);border-radius:8px;padding:22px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.tr{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink)}
.tr.bad{color:var(--crit)}
.dot-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pl 1s infinite}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}
.edited{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.sw{display:flex;gap:6px;align-items:center}
.cyc{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:0 12px;min-height:40px;border:1px solid var(--line-2);border-radius:7px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.cyc:active{background:var(--surface-2)}
@media (min-width:981px){.only-narrow{display:none!important}}

/* Touch comfort is a property of the input device, not the viewport width:
   a 1024px iPad needs big targets, a 1024px laptop does not. */
@media (pointer:coarse){
  .btn,.chip,.tab,.cyc,.lang button{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  input[type=date]{font-size:16px;min-height:44px}
  .check{padding:11px 0}
  .check input{width:18px;height:18px}
}

/* ---------- phone + tablet ---------- */
@media (max-width:980px){
  .only-wide{display:none!important}
  .wrap{padding-inline:max(14px,env(safe-area-inset-left));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .top-in{grid-template-columns:1fr auto;gap:9px 10px;padding:10px max(14px,env(safe-area-inset-left)) 0}
  .brand{grid-column:1;grid-row:1}
  .brand b{font-size:15px}
  .brand span{font-size:10px}
  #switches{grid-column:2;grid-row:1;justify-self:end}
  .tabs{grid-column:1/-1;grid-row:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
        justify-content:flex-start;padding:0 max(14px,env(safe-area-inset-left)) 8px;
        margin-inline:calc(-1 * max(14px,env(safe-area-inset-left)));scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;scroll-snap-align:start;padding:9px 13px;font-size:13.5px;min-height:40px;display:inline-flex;align-items:center}
  .sec{padding-top:22px}
  .sec-head{gap:4px;margin-bottom:14px}
  .sec-head h2{font-size:20px}
  .sec-head p{font-size:13.5px}
  .hero{padding:20px 18px}
  .hero h3{font-size:22px;margin:8px 0 10px}
  .metric{padding:13px 15px}
  .metric .v{font-size:24px}
  .metrics{gap:10px}
  .board{grid-template-columns:1fr;gap:10px}
  .post{padding:14px 15px}
  .post h4{font-size:15px}
  .detail{padding:18px 16px}
  .detail h3{font-size:19px}
  .pad{padding:17px 18px}
  .copyblock,.ed{padding:15px 16px;font-size:16px}
  .ed.short{font-size:16px;min-height:120px}
  .btn,.chip{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .btn{padding:9px 15px}
  input[type=date]{font-size:16px;min-height:40px;width:100%}
  .setup{padding:14px 16px;flex-direction:column;align-items:stretch;gap:8px}
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{padding-top:11px}
  .kv dd{padding-bottom:3px}
  .tl{grid-template-columns:62px 1fr;gap:0 12px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom));width:calc(100% - 32px);text-align:center}
  .check{padding:11px 0}
  .check input{width:18px;height:18px}
}

/* Arabic is cursive: letter-spacing severs the joins, and the mono/display
   faces carry no Arabic glyphs. Both must be undone wherever the text is Arabic. */
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4,
[dir="rtl"] .eyebrow,[dir="rtl"] .metric .k,[dir="rtl"] .metric .v span,
[dir="rtl"] .post-meta,[dir="rtl"] .post-day,[dir="rtl"] .chip,[dir="rtl"] .lang button,
[dir="rtl"] .pane-label,[dir="rtl"] .kv dt,[dir="rtl"] th,[dir="rtl"] .day-badge,
[dir="rtl"] .gaps,[dir="rtl"] .edited,[dir="rtl"] .count,[dir="rtl"] .tr,
[dir="rtl"] .brand span,[dir="rtl"] .brand b,[dir="rtl"] .tab,[dir="rtl"] .cyc,
.pane[dir="rtl"] *,.ar{font-family:var(--ui-ar);letter-spacing:0}
[dir="rtl"] .post-n{font-family:var(--mono)}
[dir="rtl"] .sec-head h2{letter-spacing:0}
</style>

<div class="top"><div class="top-in">
  <div class="brand"><b id="brandname">Dispatch Board</b><span id="cadence">30 posts · 60 days</span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="switches"></div>
</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const PILLARS={P1:{n:"Frontline AI",c:"var(--p1)"},P2:{n:"Electric Fleet",c:"var(--p2)"},P3:{n:"Build Notes",c:"var(--p3)"},P4:{n:"Operator's Desk",c:"var(--p4)"}};

const POSTS=[{"n":1,"d":1,"p":"P1","a":"A","f":"Long-form POV","t":"The 90% nobody is building AI for","c":"Most organisations are running their AI pilot in the finance team.\n\nIt makes sense. Finance has laptops, corporate email, one working language, and a manager who can absorb a bad output without anyone getting hurt. It is the easiest possible place to succeed.\n\nIt is also about ten percent of the working world.\n\nThe other ninety percent are on a shop floor, in a warehouse, on a ward — or, in my case, behind a wheel. No corporate email. Several first languages. A shift pattern that does not accommodate a two-hour training webinar. And consequences that are physical rather than reputational.\n\nI lead people and fleet operations at Ecosine Transports in Dubai. Our workforce is [[HEADCOUNT]] professional drivers running 140 electric vehicles. Over the last [[TIMEFRAME]] we have put two AI assistants into live operation with them. Not a pilot. Production, with real consequences when it goes wrong.\n\nThree things that environment taught me, none of which appear in a vendor deck:\n\n→ The model was never the hard part. Rewriting [[TIMEFRAME]] of accumulated operational knowledge into something a system could actually reason over took [[PROPORTION]] longer than the build.\n\n→ Adoption is a trust problem, not a training problem. Our usage went up after we made the assistant less capable — because we gave it permission to say \"I don't know\" and route to a human.\n\n→ A confidently wrong answer to someone operating a vehicle is not a bug report. We designed the escalation path before we designed a single answer.\n\nNone of this is theoretical for me. It is what my week consists of.\n\nSo starting today I am going to publish it — every other day, for the next sixty days. What worked, what it cost, and the parts that failed twice before they worked once.\n\nIf you are deploying AI to a workforce that does not sit at a desk, I would genuinely like to know what broke first for you.\n\nBecause I promise it wasn't the model.","h":["#FrontlineAI","#HumanResources","#ArtificialIntelligence","#FutureOfWork","#Dubai"],"m":"Native text post, no image. Post 1 should look like a person thinking, not a brand launching.","q":"If you're deploying AI to a workforce that doesn't sit at a desk, I'd like to hear what broke first."},{"n":2,"d":3,"p":"P3","a":"C","f":"Project spotlight","t":"Meet Max — the AI trainer we built for people who don't read manuals","c":"Our drivers were handed a [[PAGE COUNT]]-page operations manual on day one.\n\nNobody read it. I wouldn't have read it either.\n\nSo we built Max — an AI assistant that delivers the same material as a conversation, in the driver's own language, on the phone already in their pocket, in the ten minutes they have between runs.\n\nOnboarding went from [[BEFORE]] to [[AFTER]].\n\nThat is the headline. Here is the part that actually matters if you're thinking of building something similar.\n\nTHE MODEL WAS THE EASY BIT.\n\nBefore Max was useful to anyone, we had to rewrite every piece of source material it drew on. Our manual had been written over [[TIMEFRAME]] by [[NUMBER]] different people, with contradictions nobody had ever reconciled — because no human trainer had ever read it end to end either. They just knew which parts to ignore.\n\nMax didn't know which parts to ignore. It answered from all of it, with equal confidence.\n\nThat rewrite was [[PROPORTION]] of the total effort. It is not in any implementation plan I have ever seen.\n\nWHAT WE GOT WRONG.\n\n[[SPECIFIC FAILURE — what Max said, and how wrong it was]]\n\n[[HOW YOU CAUGHT IT — be honest if it was luck]]\n\nThat is when we built [[WHAT YOU BUILT AS A RESULT]].\n\nTHE LESSON, IF YOU TAKE ONE THING:\n\nAn AI assistant does not fix a documentation problem. It exposes one — instantly, at scale, to the people least equipped to spot the error.\n\nFix the source material first. The assistant is the last step, not the first.\n\nIf you're building an internal assistant: what did you discover about your own documentation once a system started reading it?","h":["#AIAssistants","#LearningAndDevelopment","#HRTech","#AIImplementation","#FrontlineAI"],"m":"Redacted screenshot of a real Max conversation, cropped to phone width. No stock robot graphics — they would undercut every credibility signal in the copy.","q":"What's the training material everyone is issued and nobody reads?"},{"n":3,"d":5,"p":"P2","a":"B","f":"Carousel · 8 slides","t":"What a year of running an EV fleet in 45°C actually costs","c":"The business case for fleet electrification is usually built in a spreadsheet, by someone who has never stood in a Dubai depot in August.\n\nOurs was too.\n\nHere is [[TIMEFRAME]] of real operating data from 140 electric vehicles — including the three lines we completely failed to forecast.\n\nThe short version:\n\n→ Energy cost per km came in [[FIGURE]] against our model\n→ Maintenance against our previous ICE fleet: [[FIGURE]]\n→ The heat penalty on effective range in peak summer: [[FIGURE]]\n→ The line item we never modelled at all: [[LINE ITEM]]\n\nTwo of those surprises were larger than our entire projected maintenance saving.\n\nThe wider point for anyone planning a transition in this region: the models circulating in the market were built on European and North American operating data. The physics do not travel. Ambient temperature affects range, charging efficiency, and battery thermal management simultaneously — and none of the imported models price all three.\n\nBuild your own baseline, in your own climate, before you commit capital.\n\nFull breakdown in the carousel.\n\nIf you're modelling a fleet transition in the GCC and want to pressure-test your assumptions against real operating numbers — my DMs are open.","h":["#EVFleet","#FleetManagement","#SustainableTransport","#UAE","#Electrification"],"m":"8-slide carousel PDF, 1080×1350. One figure per slide, slide 7 is the synthesis (make it the best-designed one — it's the screenshot slide), slide 8 signs it with your handle.","q":"If you're modelling a fleet transition in the GCC, my DMs are open."},{"n":4,"d":7,"p":"P1","a":"A","f":"Short-form","t":"Onboarding is a retention lever wearing an admin disguise","c":"We used to treat onboarding as paperwork with a safety briefing attached.\n\nThen we looked at when people actually leave.\n\n[[FIGURE]]% of our departures happened in the first [[PERIOD]]. Not because of pay. Because in week one, nobody could tell them what good looked like.\n\nWe rebuilt onboarding as a competency ramp instead of a compliance checklist. [[RETENTION METRIC]] moved [[FIGURE]].\n\nOnboarding is not an HR administrative function. It is the cheapest retention intervention available to you, and it is almost always owned by whoever has the least time.","h":["#PeopleOperations","#EmployeeRetention","#HumanResources","#Onboarding"],"m":"None. Short-form text posts outperform unaccompanied — an image competes with the idea.","q":"When does your attrition actually spike? Most teams have never looked."},{"n":5,"d":9,"p":"P4","a":"X","f":"Poll","t":"What's actually blocking AI in your HR function?","c":"Every AI-in-HR conversation I have eventually arrives at the same moment: the real blocker is never the one in the strategy deck.\n\nI'd like to know what it is for you.\n\nI'll share what our answer was — and what it cost us to get past it — in the comments.\n\nPOLL OPTIONS: Budget · Data quality · Leadership buy-in · Nobody owns it","h":["#HRTech","#ArtificialIntelligence","#PeopleOperations","#FutureOfWork"],"m":"Native LinkedIn poll, 7-day duration.","q":"Vote, then tell me what your organisation's real blocker was — I'm collecting these."},{"n":6,"d":11,"p":"P3","a":"C","f":"Build note","t":"We taught Yulisa to escalate before we taught her to answer","c":"The first version of Yulisa answered everything. That was the problem.\n\nWhen a driver asks about a route, a wrong answer costs you time. When a driver asks about [[SAFETY-RELEVANT SCENARIO]], a wrong answer costs you something you cannot get back.\n\nSo we inverted the build. Before Yulisa could answer a single question, we defined the categories she must never answer — and routed every one of them to a named human, immediately, with context attached.\n\nConfidence is the default failure mode of these systems. They are built to produce an answer, and they will produce one whether or not they should.\n\nDesigning the escalation path first is not a limitation on the system. It is the thing that makes the system deployable at all.","h":["#AIImplementation","#AISafety","#OperationalExcellence","#AIAssistants"],"m":"Simple flow diagram: query → classifier → answer / escalate. Hand-drawn or clean vector, not corporate clipart.","q":"If you're building an internal assistant: what's on your never-answer list?"},{"n":7,"d":13,"p":"P1","a":"A","f":"Carousel · 10 slides","t":"The 7-stage onboarding map for a non-desk workforce","c":"Standard onboarding assumes a desk, a laptop, an inbox, and eight uninterrupted hours.\n\nOur people have none of those.\n\nThis is the seven-stage map we run instead — built for a workforce that is mobile, multilingual, and available in ten-minute windows.\n\nSwipe through. Steal any of it.\n\nSLIDES: 1 Title · 2 Why standard onboarding fails frontline teams · 3 Pre-arrival · 4 Day one & documentation · 5 Language-matched training · 6 Supervised competency · 7 30-day checkpoint · 8 90-day certification · 9 The metric that tells you it worked · 10 CTA","h":["#Onboarding","#PeopleOperations","#FrontlineWorkers","#HumanResources","#HRStrategy"],"m":"10-slide carousel PDF, 1080×1350.","q":"Which stage does your organisation skip? It's almost always stage 6."},{"n":8,"d":15,"p":"P2","a":"B","f":"Long-form","t":"Range anxiety is a management problem, not a battery problem","c":"Every fleet electrification objection I hear starts with range.\n\nThree years into running an electric fleet — 140 vehicles today — I can tell you that range has almost never been our constraint. Scheduling has.\n\nThe vehicle can do the distance. The question is whether your roster, your charging windows, and your dispatch logic were designed by someone who understands that an EV refuels on a completely different curve to a diesel.\n\nWe solved range anxiety by changing three things, none of which involved the vehicles:\n\n→ We rostered around state of charge, not distance. A diesel roster can treat every vehicle as interchangeable, because refuelling takes five minutes. An electric one cannot. We started matching the longest duties to the vehicles coming off a full charge, and treating state of charge as a hard scheduling constraint — the same way we treat driver hours.\n\n→ We stopped charging to 100%. The last twenty percent of a battery charges far more slowly than the first eighty. Holding a vehicle on a charger through that final stretch was costing us depot throughput we could not spare. Charging to 80% and building the roster around it freed capacity without adding a single charge point.\n\n→ We moved charging into dwell time we already had. We mapped every point in the schedule where a vehicle was already stationary — loading, breaks, shift change — and put charging there, instead of treating it as a separate depot event that everything else had to be scheduled around.\n\nIn the twelve months since, we have had [[N]] duties cut short for state of charge. In the twelve months before, it was [[N]].\n\nRange is where the conversation starts because it's the number on the spec sheet. It is rarely where the problem lives.","h":["#EVFleet","#FleetManagement","#Electrification","#Logistics","#SustainableTransport"],"m":"Single photo — your vehicles at a charging point at your depot. Real, not stock.","q":"Fleet managers: what was your actual constraint, once you got past range?"},{"n":9,"d":17,"p":"P1","a":"A","f":"Contrarian short","t":"\"Will AI replace recruiters?\" is the least interesting question in HR","c":"It gets asked at every conference. It generates every headline. And it is a distraction.\n\nThe interesting question is the one underneath it: which parts of the people function currently fail because a human simply cannot be present often enough?\n\nNobody is short of recruiters. Organisations are short of the thing that happens after the hire — the coaching conversation in week three, the competency check in month two, the answer to a question at 11pm on a Thursday.\n\nThat is where AI has earned its place in our operation. Not replacing the people we have. Covering the ground they were never able to cover.","h":["#HumanResources","#ArtificialIntelligence","#FutureOfWork","#Recruitment"],"m":"None.","q":"Where does presence fail in your organisation? That's your AI use case."},{"n":10,"d":19,"p":"P3","a":"C","f":"Project spotlight","t":"We ran Max against a human trainer for 30 days","c":"Building an AI assistant is easy to justify with a feeling. We wanted a number.\n\nSo for 30 days we ran two cohorts: [[N]] drivers trained by Max, [[N]] trained by our most experienced human trainer. Same content. Same assessment at the end.\n\nResults:\n→ [[FINDING 1]]\n→ [[FINDING 2]]\n→ [[FINDING 3]]\n\nThe honest summary: Max won on [[DIMENSION]] and lost on [[DIMENSION]].\n\n[[WHAT YOU DID WITH THAT FINDING]]\n\nIf you are evaluating an AI system and you don't have a human baseline to compare against, you don't have an evaluation. You have a demo.","h":["#AIImplementation","#LearningAndDevelopment","#HRTech","#DataDriven"],"m":"Two-column comparison graphic. Show the dimension where the human won — that single choice is what makes the whole post credible.","q":"Has anyone else run a controlled comparison like this? I'd like to compare methodology."},{"n":11,"d":21,"p":"P4","a":"X","f":"Story","t":"The driver who taught me more about AI adoption than any vendor demo","c":"[[ANONYMISED DRIVER]] refused to use Max for the first [[PERIOD]].\n\nNot loudly. He simply didn't open it.\n\nWhen I finally asked him why, he said something I have not been able to forget:\n\n[[HIS ACTUAL OBJECTION]]\n\nHe was right. [[WHAT YOU CHANGED AS A RESULT]]\n\nAdoption is not a training problem. It is a trust problem, and trust is earned by changing the product, not by running another briefing.","h":["#ChangeManagement","#Leadership","#AIAdoption","#PeopleFirst"],"m":"None, or a wide depot shot with no identifiable faces. Never photograph the person in the story.","q":"Who was the person in your rollout who was right to resist?"},{"n":12,"d":23,"p":"P2","a":"B","f":"Infographic","t":"The 9 EV fleet cost lines nobody models","c":"Every EV fleet business case I have reviewed models the same four things: vehicle capex, energy, maintenance, and residual value.\n\nHere are nine more that we learned about the expensive way.\n\n→ Grid connection. Not the chargers — the supply behind them. Transformer, cabling, utility works, and a lead time measured in months rather than weeks.\n\n→ Peak demand charges. Your model multiplies kWh by a rate. Your utility also bills you on the highest simultaneous draw you ever hit. Twenty vehicles charging at once sets a number you keep paying against.\n\n→ Civil works. Trenching, ducting, bollards, drainage, re-marking bays, fire separation. The chargers are the cheap part. Putting them in the ground is not.\n\n→ Charger maintenance and downtime. Chargers are assets and they fail. The real cost is not the repair — it is the bay you cannot roster against while it is out.\n\n→ Thermal management. Conditioning the pack and pre-cooling the cabin draws energy that never appears in the kWh-per-km figure on the spec sheet. In a Gulf summer that is not a rounding error.\n\n→ Charging losses. The energy your meter bills you for and the energy that reaches the battery are not the same number. You pay the difference on every charge, forever.\n\n→ Parts lead time. EV supply chains are thinner. A fault that puts a diesel off the road for two days can put an EV off the road for weeks. That is a revenue line, not a maintenance line.\n\n→ Retraining. High-voltage certification for workshop staff, and re-training drivers on regenerative braking and charging discipline. It recurs every time headcount turns over.\n\n→ Warranty conditions. Battery warranties constrain how you may charge — fast-charge frequency, state-of-charge limits. That is a cost in operational flexibility, and it lands on your roster.\n\nThree of these were larger than our maintenance saving. If your model doesn't have them, your model is optimistic.","h":["#FleetManagement","#EVFleet","#TCO","#Logistics","#UAE"],"m":"Single infographic, 1080×1350. Nine rows: name in the heavy face, mechanism clause beneath. Mark the three that exceeded your maintenance saving in the accent colour — that one decision makes it worth saving rather than just reading.","q":"What was the line item your business case missed?"},{"n":13,"d":25,"p":"P1","a":"A","f":"Long-form","t":"Your AI policy is unreadable to most of your workforce","c":"I read our own AI usage policy back in [[LANGUAGE]] — one of the [[NUMBER]] languages our drivers actually speak.\n\nIt was incomprehensible. Not because of the translation. Because the original was written at a reading level our workforce was never going to meet, by people who assumed the reader had time, context, and a laptop.\n\nA policy that cannot be understood is not a policy. It is documentation of an intention.\n\nHere is what we replaced it with: [[APPROACH]]\n\nIf you have a frontline workforce and your AI governance lives in a PDF on an intranet, you do not have AI governance. You have exposure.","h":["#AIGovernance","#HumanResources","#Compliance","#FrontlineAI","#PeopleOperations"],"m":"Side-by-side: dense policy paragraph vs. your rewritten version. The visual contrast carries the argument.","q":"Read your own policy in your second language. Tell me how it goes."},{"n":14,"d":27,"p":"P3","a":"C","f":"Build note","t":"We gave our AI permission to say \"I don't know\"","c":"The single highest-value change we made to Yulisa was teaching her to decline.\n\nBefore: every question received an answer, delivered with total confidence.\nAfter: [[FIGURE]]% of queries return \"I don't have a reliable answer — I'm routing this to [[HUMAN ROLE]].\"\n\nOur resolution rate went down. Trust went up, and it went up sharply.\n\nThe counterintuitive part: driver usage increased after we made the assistant less capable. People will use a system that is honest about its limits. They abandon one that has misled them once.","h":["#AIImplementation","#AIAssistants","#TrustAndSafety","#ProductDesign"],"m":"Redacted screenshot of Yulisa declining a question and escalating.","q":"Does your internal AI tool have a way to admit uncertainty? If not, that's the next thing to build."},{"n":15,"d":29,"p":"P1","a":"A","f":"Carousel · 11 slides","t":"5 HR processes we automated — and 3 we deliberately didn't","c":"The automation question is never \"can we?\" It is \"should we, and what do we lose?\"\n\nFive things we handed to a system, three we kept human on purpose, and the reasoning behind each call.\n\nThe three we kept are the more useful half of this post.\n\nSLIDES: 1 Title · 2 The test we apply · 3–7 The five automated, one per slide with its metric · 8–10 The three we kept human, and why · 11 CTA","h":["#HRAutomation","#PeopleOperations","#HumanResources","#AIImplementation","#HRStrategy"],"m":"11-slide carousel PDF, 1080×1350.","q":"What's the process you'd never automate, no matter how good the tool gets?"},{"n":16,"d":31,"p":"P2","a":"B","f":"POV","t":"Dubai's EV transition will be won in the depot, not the showroom","c":"The coverage is all about vehicles. Range, charging speed, new models, launch events.\n\nAlmost none of it is about the depot — which is where every fleet transition in this region will actually succeed or fail.\n\nThe depot is where you discover that your charging capacity is a function of your grid connection, not your charger count. That your roster has to be rebuilt around energy, not distance. That [[SPECIFIC DEPOT-LEVEL CONSTRAINT YOU HIT]].\n\nThe UAE has the policy ambition and the capital. What is genuinely scarce is operators who have run the depot side at scale and can tell you what it takes.\n\n[[YOUR VIEW ON WHAT THE REGION NEEDS NEXT]]","h":["#EVFleet","#UAE","#Dubai","#SustainableTransport","#Infrastructure"],"m":"Depot photograph, wide, showing scale.","q":"If you're running or planning a depot transition in the GCC — I'd like to connect."},{"n":17,"d":33,"p":"P1","a":"A","f":"Short-form","t":"The competency gap you cannot see on a CV","c":"Two drivers arrive with identical licences, identical years of experience, identical paperwork.\n\nThree months in, one is in the top decile on [[METRIC]] and the other is in the bottom.\n\nNothing on the CV predicted it. What predicted it was [[ACTUAL PREDICTOR]] — something we only started measuring after we built the systems to measure it.\n\nMost hiring for frontline roles is credential-matching. The credentials are table stakes. The variance sits entirely in things a CV was never designed to capture.","h":["#Recruitment","#HumanResources","#TalentAcquisition","#PeopleAnalytics"],"m":"None.","q":"What predicts performance in your frontline roles — that isn't on the CV?"},{"n":18,"d":35,"p":"P4","a":"X","f":"Poll","t":"How does your organisation actually measure frontline training?","c":"I ask this in every conversation with another operator, and the answer is almost always the first option.\n\nWhich is how you end up with a fully-trained workforce on paper and a competency problem in practice.\n\nCurious where this community sits.\n\nPOLL OPTIONS: Completion rate · Assessment score · On-the-job performance · We don't, really","h":["#LearningAndDevelopment","#PeopleOperations","#Training","#HumanResources"],"m":"Native poll, 7 days.","q":"If you picked option 3 — tell me how. That's the hard one and I want to learn from it."},{"n":19,"d":37,"p":"P3","a":"C","f":"Long-form","t":"What it actually costs to keep an AI assistant alive in production","c":"The build was the cheap part. Nobody tells you this.\n\nHere is the honest ongoing cost of running two AI assistants in live operations for [[TIMEFRAME]]:\n\n→ Inference / API: [[FIGURE]]\n→ Content maintenance — the source material goes stale: [[FIGURE]]\n→ Human review of escalations: [[FIGURE]]\n→ Evaluation and regression testing after every model change: [[FIGURE]]\n→ [[YOUR FOURTH COST LINE]]\n\nThe largest line is [[LARGEST LINE]], and it is not the one anyone budgets for.\n\nAn AI assistant is not a project you finish. It is a system you staff. Budget it like a system, or it will quietly degrade until people stop trusting it — and re-earning that trust costs more than the original build.","h":["#AIImplementation","#AIOps","#OperationalExcellence","#TechnologyLeadership"],"m":"Simple cost-breakdown bar chart.","q":"Founders and ops leads: what's your real run-cost line that nobody warned you about?"},{"n":20,"d":39,"p":"P2","a":"B","f":"Data post","t":"Driver behaviour moves efficiency more than vehicle spec does","c":"We run 140 identical vehicles.\n\nThe gap between our most efficient and least efficient driver on the same route is [[FIGURE]]%.\n\nSame vehicle. Same road. Same load. The variable is the person.\n\nWhich means the highest-return investment in an electric fleet is not the next generation of battery. It is a coaching programme built on telematics that drivers actually accept.\n\nWe built ours around [[APPROACH]]. Fleet-wide [[EFFICIENCY METRIC]] moved [[FIGURE]] in [[TIMEFRAME]].\n\nProcurement gets the attention. Behaviour gets the result.","h":["#FleetManagement","#Telematics","#EVFleet","#DriverBehaviour","#Efficiency"],"m":"Distribution chart — efficiency spread across drivers, anonymised. This visual is the post.","q":"What's the efficiency spread across your fleet? Most operators have never plotted it."},{"n":21,"d":41,"p":"P1","a":"A","f":"Carousel · 14 slides","t":"The frontline AI readiness audit — 12 questions","c":"Before you buy anything, answer these twelve questions about your own organisation.\n\nIf you cannot answer nine of them, the tool is not your problem.\n\nThis is the audit I wish someone had handed me [[TIMEFRAME]] ago. It would have saved us [[WHAT IT WOULD HAVE SAVED]].\n\nSwipe through, save it, run it with your team.\n\nSLIDES: 1 Title · 2 Why most frontline AI projects fail before procurement · 3–6 Your data · 7–9 Your people · 10–12 Your operations · 13 How to score it · 14 CTA","h":["#AIImplementation","#HRTech","#FrontlineAI","#DigitalTransformation","#PeopleOperations"],"m":"14-slide carousel PDF. Highest save-rate format on the calendar — design this one properly.","q":"Run it and tell me your score. I'll tell you ours."},{"n":22,"d":43,"p":"P2","a":"B","f":"Long-form","t":"Charging infrastructure is a rostering problem","c":"When we planned our charging, we asked the wrong question: how many chargers do we need?\n\nThe right question was: what does our roster look like if energy, not distance, is the binding constraint?\n\nThose produce completely different answers. The first gets you a capex number. The second gets you an operating model.\n\nWhat changed once we reframed it:\n→ [[CHANGE 1]]\n→ [[CHANGE 2]]\n→ [[CHANGE 3]]\n\nResult: [[METRIC]] on [[FIGURE]] fewer charge points than our original plan called for.\n\nThe cheapest charger is the one you didn't need to install because the roster was designed properly.","h":["#EVFleet","#ChargingInfrastructure","#FleetManagement","#OperationsManagement","#SustainableTransport"],"m":"Before/after roster or charge-utilisation diagram.","q":"Fleet operators: did you size your charging off vehicle count, or off your roster?"},{"n":23,"d":45,"p":"P1","a":"A","f":"Story","t":"We ran the same training in four languages. Only one version worked.","c":"We translated our driver training into [[NUMBER]] languages and congratulated ourselves on inclusion.\n\nThen we looked at the completion and competency data by language group.\n\n[[WHAT THE DATA SHOWED]]\n\nThe problem was not translation quality. It was that we had translated the words and kept the structure — a structure built around [[CULTURAL ASSUMPTION]] that did not hold for most of our workforce.\n\n[[WHAT YOU REBUILT]]\n\nTranslation is not localisation. And localisation is not a language exercise — it is a redesign exercise that happens to involve language.","h":["#Localisation","#LearningAndDevelopment","#DiversityAndInclusion","#FrontlineWorkers","#HumanResources"],"m":"Bar chart of completion or competency by language group, anonymised.","q":"If you train a multilingual workforce — have you ever segmented your training data by language? Do it this week."},{"n":24,"d":47,"p":"P3","a":"C","f":"Project spotlight","t":"The workflow behind Max and Yulisa","c":"People ask what the architecture looks like. Honestly, the architecture is the least interesting part.\n\nHere is the actual workflow — end to end — for what happens when a driver asks a question:\n\n[[STEP 1]] → [[STEP 2]] → [[STEP 3]] → [[STEP 4]] → [[STEP 5]]\n\nTwo things in there that took us longest to get right, and that I'd build first if I started again:\n\n1. [[HARD-WON DESIGN DECISION 1]]\n2. [[HARD-WON DESIGN DECISION 2]]\n\nTogether, Max and Yulisa now handle [[VOLUME]] interactions per [[PERIOD]]. Roughly [[FIGURE]]% still reach a human — and that number is deliberate, not a shortfall.","h":["#AIAssistants","#AIImplementation","#SystemDesign","#OperationalExcellence","#HRTech"],"m":"Clean end-to-end workflow diagram. This is your most-shared asset if it's legible — invest in it.","q":"Building something similar? Tell me where your workflow differs — I'm collecting patterns."},{"n":25,"d":49,"p":"P1","a":"A","f":"Long-form","t":"The HR operating system we run — six systems, one dashboard","c":"A people function is not a set of policies. It is a set of systems that either talk to each other or don't.\n\nOurs: [[SYSTEM 1]] · [[SYSTEM 2]] · [[SYSTEM 3]] · [[SYSTEM 4]] · [[SYSTEM 5]] · [[SYSTEM 6]] — feeding one operational dashboard that [[WHO]] reviews [[FREQUENCY]].\n\nThe dashboard was the last thing we built and the thing that changed the most. Before it, every conversation with the leadership team was a narrative. After it, every conversation was about a number and a trend.\n\nWhat I would do differently: [[HONEST LESSON]]\n\nIf your people function cannot produce its own operating numbers on demand, it will always be a cost centre in the room where budget is decided.","h":["#PeopleOperations","#HRStrategy","#PeopleAnalytics","#HumanResources","#OperationalExcellence"],"m":"Dashboard screenshot, fully redacted, or a clean systems-map diagram.","q":"What's in your people-ops stack — and what's still living in a spreadsheet?"},{"n":26,"d":51,"p":"P2","a":"B","f":"Short-form","t":"Sustainability reporting a fleet manager can actually produce","c":"Most sustainability frameworks were written for people with a reporting team.\n\nFleet operators do not have a reporting team. They have a fleet manager with an already-full week.\n\nSo we built the smallest version that is still defensible: [[NUMBER]] metrics, [[FREQUENCY]], pulled automatically from [[SOURCE]]. It takes [[TIME]] to produce.\n\nThe metrics: [[METRIC 1]] · [[METRIC 2]] · [[METRIC 3]]\n\nA defensible report you actually publish every month beats a comprehensive framework you abandon in quarter two.","h":["#Sustainability","#ESG","#FleetManagement","#EVFleet","#Reporting"],"m":"Screenshot of your actual monthly report, redacted.","q":"What's the minimum viable sustainability report in your operation?"},{"n":27,"d":53,"p":"P1","a":"A","f":"Infographic","t":"The full cost of a bad frontline hire","c":"Most organisations count the recruitment fee and stop there.\n\nHere is the complete stack, using our real numbers:\n\n→ Sourcing and screening: [[FIGURE]]\n→ Documentation, visa and compliance: [[FIGURE]]\n→ Training and certification: [[FIGURE]]\n→ Supervised ramp — the productivity cost of the supervisor: [[FIGURE]]\n→ Lost productivity to exit: [[FIGURE]]\n→ Replacement cycle: [[FIGURE]]\n→ TOTAL: [[FIGURE]]\n\nThat total is why we invested in onboarding and competency systems before we invested in anything else. The business case wasn't ideological. It was arithmetic.","h":["#HumanResources","#CostOfHiring","#PeopleAnalytics","#Recruitment","#Retention"],"m":"Stacked-cost infographic, 1080×1350. Build the total visually so the final number lands.","q":"Do you know your fully-loaded cost per bad hire? Most teams know only the first line."},{"n":28,"d":55,"p":"P2","a":"B","f":"Long-form","t":"The heat tax on an electric fleet","c":"Nobody's EV model includes a line for August in the Gulf. Ours does now.\n\nWhat [[SUMMER PERIOD]] costs us, measured against our [[WINTER PERIOD]] baseline:\n\n→ Effective range: [[FIGURE]]\n→ Charging efficiency: [[FIGURE]]\n→ Battery thermal management draw: [[FIGURE]]\n→ Cabin cooling: [[FIGURE]]\n→ [[YOUR FIFTH FINDING]]\n\nHow we operate around it: [[MITIGATION 1]] · [[MITIGATION 2]] · [[MITIGATION 3]]\n\nThis is the number one thing I would tell any operator importing a European or North American fleet model into this region. The physics do not travel. Build your own baseline in your own climate before you commit capital.","h":["#EVFleet","#Electrification","#UAE","#FleetManagement","#SustainableTransport"],"m":"Seasonal comparison chart — range or efficiency by month across a full year.","q":"Operating EVs in extreme heat anywhere? I'd like to compare baselines."},{"n":29,"d":57,"p":"P1","a":"A","f":"Contrarian","t":"Stop hiring for \"AI-savvy\". Hire for process-literate.","c":"Every people-team job spec now asks for AI literacy. Most of them are asking for the wrong thing.\n\nThe people who have made AI work in our operation were not the ones who arrived knowing the tools. They were the ones who could describe an existing process precisely enough that it could be automated at all.\n\nTool knowledge has a half-life measured in months. The ability to decompose a messy operational process into steps, decisions, exceptions and owners does not expire.\n\nIf you cannot document the process, you cannot automate it. And most organisations discover this only after they have bought the licence.","h":["#Hiring","#TalentAcquisition","#HumanResources","#AIImplementation","#FutureOfWork"],"m":"None.","q":"What are you actually screening for when you say 'AI literacy'?"},{"n":30,"d":59,"p":"P4","a":"X","f":"Recap + CTA","t":"30 posts, 60 days — what changed","c":"Two months ago I decided to publish what we have learned running AI systems for a frontline workforce, instead of keeping it in internal documents nobody outside the company would ever read.\n\nWhat happened:\n→ [[FOLLOWER GROWTH]]\n→ [[MOST-READ POST + WHY IT SURPRISED YOU]]\n→ [[NUMBER]] conversations with operators facing the same problems\n→ [[ANY TANGIBLE OUTCOME — partnership, hire, speaking invitation]]\n\nWhat I got wrong: [[HONEST REFLECTION]]\n\nThe most valuable thing was not the reach. It was that writing this down forced me to examine decisions I had been making on instinct. Several of them did not survive being written out.\n\nNext 60 days, I'm going deeper on [[NEXT FOCUS]].\n\nIf you have been reading — thank you. If you're working on any of this, my DMs are open.","h":["#FrontlineAI","#PeopleOperations","#EVFleet","#Leadership","#BuildingInPublic"],"m":"None. This post should be plain text.","q":"Tell me what you'd like me to cover next — I'll build the next calendar around the replies."}];

const ABOUT=`Most organisations are piloting AI for the ten percent of their workforce that sits at a desk.

I work on the other ninety percent.

I lead people and fleet operations at Ecosine Transports in Dubai, where our workforce is [[HEADCOUNT]] professional drivers operating a fleet of 140 electric vehicles. They do not have corporate email. They work across [[NUMBER]] languages. They operate in 45°C heat on schedules where a wrong answer is not an inconvenience — it is a safety event.

That environment does not tolerate AI theatre. It is the reason the systems we build have to be genuinely good.

Over the past [[TIMEFRAME]] I have designed and deployed two AI assistants into live operations:

→ Max — driver training and competency development. Onboarding time moved from [[BEFORE]] to [[AFTER]], and [[METRIC]] improved by [[FIGURE]].

→ Yulisa — real-time operational support for drivers and dispatch. Now handles [[VOLUME]] queries per [[PERIOD]], with a deliberate escalation path to a human for anything safety-related.

Alongside that, I run the operating side of an electric fleet: charging strategy, route and roster optimisation, driver behaviour programmes, and the sustainability reporting that comes with it. Over [[TIMEFRAME]] we have moved [[CORE METRIC]] by [[FIGURE]].

WHAT I WRITE ABOUT HERE

▪ Deploying AI to frontline, non-desk, multilingual workforces — including what fails
▪ The real unit economics of running an EV fleet in the Gulf
▪ Building AI assistants that survive contact with live operations
▪ Building HR systems that operations teams will actually use

I publish every other day. Everything I share comes from systems I have personally run, with the costs included — not from a vendor deck.

If you are deploying AI into a frontline workforce, electrifying a fleet in the region, or building operational AI and want to compare notes on what breaks — my DMs are open.

[[EMAIL]] · Dubai, UAE`;

const AR_CAPS={
1:`معظم المؤسسات تُجري تجربتها الأولى مع الذكاء الاصطناعي في قسم المالية.

وهذا منطقي. فقسم المالية لديه حواسيب، وبريد إلكتروني مؤسسي، ولغة عمل واحدة، ومدير قادر على استيعاب مُخرَج خاطئ دون أن يتأذى أحد. إنه أسهل مكان ممكن للنجاح.

وهو أيضًا نحو عشرة بالمئة من عالم العمل.

أما التسعون بالمئة الأخرى فهم في أرض مصنع، أو في مستودع، أو في جناح مستشفى — أو، في حالتي، خلف المقود. لا بريد مؤسسي. لغات أُم متعددة. ونظام مناوبات لا يتّسع لندوة تدريبية من ساعتين. وعواقب مادية، لا عواقب تمسّ السمعة.

أقود عمليات الموارد البشرية والأسطول في «إيكوساين ترانسبورت» في دبي. قوتنا العاملة [[HEADCOUNT]] سائقًا محترفًا يشغّلون 140 مركبة كهربائية. وعلى مدى [[TIMEFRAME]] الماضية أدخلنا مساعدَين بالذكاء الاصطناعي إلى التشغيل الفعلي معهم. ليست تجربة. تشغيل حقيقي، بعواقب حقيقية حين يخطئ.

ثلاثة أمور علّمتني إياها تلك البيئة، ولا يذكرها أي عرض تقديمي من مورّد:

← لم يكن النموذج هو الجزء الصعب يومًا. إعادة صياغة [[TIMEFRAME]] من المعرفة التشغيلية المتراكمة إلى صورة يستطيع النظام أن يفكّر فيها استغرقت [[PROPORTION]] من زمن البناء نفسه.

← التبنّي مشكلة ثقة لا مشكلة تدريب. ارتفع استخدامنا بعد أن جعلنا المساعد أقل قدرة — لأننا منحناه إذنًا بأن يقول «لا أعرف» ويحوّل السؤال إلى إنسان.

← الإجابة الخاطئة الواثقة لشخص يقود مركبة ليست بلاغ خلل برمجي. صمّمنا مسار التصعيد قبل أن نصمّم إجابة واحدة.

لا شيء من هذا نظري بالنسبة لي. هذا ما يتكوّن منه أسبوعي.

لذلك، ابتداءً من اليوم، سأنشر هذا — كل يومين، على مدى الستين يومًا القادمة. ما نجح، وما كلّف، والأجزاء التي فشلت مرتين قبل أن تنجح مرة.

إن كنت تنشر الذكاء الاصطناعي على قوة عاملة لا تجلس خلف مكتب، فأودّ فعلًا أن أعرف ما الذي انكسر أولًا لديك.

لأنني أعِدك أنه لم يكن النموذج.`,
2:`سُلّم سائقونا دليل عمليات من [[PAGE COUNT]] صفحة في يومهم الأول.

لم يقرأه أحد. وأنا نفسي ما كنت لأقرأه.

فبنينا «ماكس» — مساعد ذكاء اصطناعي يقدّم المادة نفسها في صورة محادثة، بلغة السائق، على الهاتف الذي في جيبه أصلًا، في العشر دقائق التي تفصل بين رحلتين.

انتقل التأهيل من [[BEFORE]] إلى [[AFTER]].

هذا هو العنوان. وإليك ما يهم فعلًا إن كنت تفكّر في بناء شيء مشابه.

النموذج كان الجزء السهل.

قبل أن يصبح «ماكس» مفيدًا لأحد، كان علينا إعادة كتابة كل مادة مصدرية يستند إليها. كُتب دليلنا على مدى [[TIMEFRAME]] بأيدي [[NUMBER]] أشخاص مختلفين، بتناقضات لم يوفّق بينها أحد يومًا — لأن أي مدرّب بشري لم يقرأه كاملًا هو الآخر. كانوا ببساطة يعرفون أي الأجزاء يتجاهلونها.

«ماكس» لم يكن يعرف أي الأجزاء يتجاهل. كان يجيب من كلها، بالثقة نفسها.

استهلكت إعادة الكتابة تلك [[PROPORTION]] من مجمل الجهد. وهي لا ترد في أي خطة تنفيذ رأيتها.

ما الذي أخطأنا فيه.

[[SPECIFIC FAILURE — ماذا قال «ماكس»، وكم كان بعيدًا عن الصواب]]

[[HOW YOU CAUGHT IT — كن صريحًا إن كان الأمر محض حظ]]

عندها بنينا [[WHAT YOU BUILT AS A RESULT]].

الدرس، إن أخذت شيئًا واحدًا:

مساعد الذكاء الاصطناعي لا يصلح مشكلة توثيق. بل يكشفها — فورًا، وعلى نطاق واسع، أمام أقل الناس قدرة على رصد الخطأ.

أصلح المادة المصدرية أولًا. المساعد هو الخطوة الأخيرة، لا الأولى.

إن كنت تبني مساعدًا داخليًا: ماذا اكتشفت عن توثيقك أنت حين بدأ نظام يقرأه؟`,
3:`تُبنى الجدوى الاقتصادية لكهربة الأساطيل عادةً في جدول بيانات، على يد شخص لم يقف يومًا في مستودع بدبي في أغسطس.

وجدوانا كانت كذلك.

إليك [[TIMEFRAME]] من بيانات التشغيل الحقيقية لـ140 مركبة كهربائية — بما فيها البنود الثلاثة التي أخفقنا تمامًا في توقّعها.

اثنتان من هذه المفاجآت كانتا أكبر من كامل وفر الصيانة المتوقَّع.

والنقطة الأوسع لكل من يخطّط لتحوّل في هذه المنطقة: النماذج المتداولة في السوق بُنيت على بيانات تشغيل أوروبية وأمريكية شمالية. الفيزياء لا تنتقل. فدرجة الحرارة المحيطة تؤثر في المدى، وكفاءة الشحن، وإدارة حرارة البطارية في آنٍ واحد — ولا يسعّر أي من النماذج المستوردة الثلاثة معًا.

ابنِ خط أساسك الخاص، في مناخك أنت، قبل أن ترصد رأس المال.

التفصيل الكامل في العرض المتسلسل.

إن كنت تضع نموذجًا لتحوّل أسطول في الخليج وتريد اختبار افتراضاتك أمام أرقام تشغيل حقيقية — رسائلي مفتوحة.`};
const AR_ABOUT=`معظم المؤسسات تُجري تجاربها مع الذكاء الاصطناعي لأجل العشرة بالمئة من قوتها العاملة الذين يجلسون خلف مكاتب.

أنا أعمل على التسعين بالمئة الآخرين.

أقود عمليات الموارد البشرية والأسطول في «إيكوساين ترانسبورت» بدبي، حيث تتكوّن قوتنا العاملة من [[HEADCOUNT]] سائقًا محترفًا يشغّلون أسطولًا من 140 مركبة كهربائية. لا يملكون بريدًا مؤسسيًا. يعملون عبر [[NUMBER]] لغات. ويشتغلون في حرارة تبلغ ٤٥ درجة وفق جداول لا تكون فيها الإجابة الخاطئة إزعاجًا — بل حادثة سلامة.

تلك البيئة لا تحتمل استعراض الذكاء الاصطناعي. ولهذا وجب أن تكون الأنظمة التي نبنيها جيدة فعلًا.

على مدى [[TIMEFRAME]] الماضية صمّمتُ ونشرتُ مساعدَين بالذكاء الاصطناعي في التشغيل الفعلي:

← «ماكس» — لتدريب السائقين وتنمية الكفاءة. انتقل زمن التأهيل من [[BEFORE]] إلى [[AFTER]]، وتحسّن [[METRIC]] بنسبة [[FIGURE]].

← «يوليسا» — للدعم التشغيلي اللحظي للسائقين وغرفة العمليات. تعالج الآن [[VOLUME]] استفسارًا لكل [[PERIOD]]، مع مسار تصعيد مقصود إلى إنسان في كل ما يمسّ السلامة.

وإلى جانب ذلك أدير الجانب التشغيلي لأسطول كهربائي: استراتيجية الشحن، وتحسين المسارات والجداول، وبرامج سلوك السائقين، وتقارير الاستدامة المرتبطة بها. وعلى مدى [[TIMEFRAME]] حرّكنا [[CORE METRIC]] بمقدار [[FIGURE]].

ما أكتب عنه هنا

▪ نشر الذكاء الاصطناعي على قوى عاملة ميدانية متعددة اللغات خارج المكاتب — بما في ذلك ما يفشل منه
▪ الاقتصاديات الحقيقية لتشغيل أسطول كهربائي في الخليج
▪ بناء مساعدين بالذكاء الاصطناعي يصمدون أمام التشغيل الحقيقي
▪ بناء أنظمة موارد بشرية تستخدمها فرق العمليات فعلًا

أنشر كل يومين. وكل ما أشاركه يأتي من أنظمة شغّلتها بنفسي، بتكاليفها كاملة — لا من عرض تقديمي لمورّد.

إن كنت تنشر الذكاء الاصطناعي على قوة عاملة ميدانية، أو تكهرب أسطولًا في المنطقة، أو تبني ذكاءً اصطناعيًا تشغيليًا وتريد تبادل الخبرات حول ما ينكسر — رسائلي مفتوحة.

<script>
const DRAFT_NOTES={
1:"<b>Opening line</b> is a flat observation about other people's behaviour — testable against the reader's own organisation, and not \"excited to share\". <b>\"It makes sense\"</b> concedes the opposing view before dismantling it, which buys credibility in an executive register. Credentials land fourth, not first: you earn the right to speak before stating the qualification. <b>\"Not a pilot. Production.\"</b> is your most differentiating claim, so it gets its own beat. The three arrows each seed a later post. The closing punch — <i>\"Because I promise it wasn't the model\"</i> — is contestable, and contestable statements get replies where open questions get none.",
2:"<b>\"I wouldn't have read it either\"</b> removes any hint of blaming the workforce — the difference between empathy and condescension. The metric appears early and is then explicitly set aside (<i>\"here is the part that actually matters\"</i>); refusing to dwell on your own result is a strong authority signal. <b>\"They just knew which parts to ignore\"</b> is the best line in the post: it reframes a documentation problem as an institutional-knowledge problem. The failure section is mandatory and must be specific, with the detection method — vague failures read as false modesty. The closing principle is written to stand alone as a screenshot.",
3:"<b>\"Ours was too\"</b> on line three removes the consultant-lecturing-you reading: you made the same mistake as the reader. The caption gives the answers away before the swipe prompt — counterintuitive, but caption-as-summary out-taps caption-as-teaser, because the reader now trusts there is more. <b>\"Two of those surprises were larger than our entire projected maintenance saving\"</b> is the sentence that survives a reshare. <b>\"The physics do not travel\"</b> is a five-word version of the whole post. The DM call-to-action is the first commercial ask in the sequence — and it comes only after two posts of pure value."};
const DISCLOSURE=["Every figure cleared for public disclosure","No client, route or contract identifiable from the data","Commercially sensitive absolutes converted to percentages or indexed to a baseline","Figures reconcile with each other — a reader will check","You can produce the underlying data if a journalist or partner asks"];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const phRe=/\[\[[^\]]*\]\]/g;
const phCount=s=>(String(s||"").match(phRe)||[]).length;
const phSet=s=>((String(s||"").match(phRe)||[]).slice().sort().join("|"));
const mark=s=>esc(s).replace(/\[\[([^\]]*)\]\]/g,'<span class="ph">[[$1]]</span>');
const LIMIT=3000, HL=220, AB=2600;
const byN=n=>POSTS.find(p=>p.n===+n);

let S={start:"",pub:{},chk:{},txt:{},lang:"en",theme:"auto",updatedAt:0};
let TAB="today", SEL=null, FILT="all", HIDE=false, EDIT=null, DOC=null;
const TRANS={};
const LS="fdb.state.v2";
try{const r=localStorage.getItem(LS)||localStorage.getItem("fdb.state.v1"); if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
S.txt=S.txt||{};
const HOST_THEME=document.documentElement.getAttribute("data-theme")||"";

function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} if(DOC)DOC.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}
(async()=>{ let db=null; try{ db=await claude.use("db"); }catch(e){}
  if(!db) return; DOC=db.doc("state/console");
  try{ const snap=await DOC.get(); const rem=snap&&snap.data?snap.data():null;
    if(rem&&(rem.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(S,rem);S.txt=S.txt||{};try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} render();}
    else if(S.updatedAt){ await DOC.set(JSON.parse(JSON.stringify(S))); }
  }catch(e){}
})();
let SAMPLE, SAMPLE_TRIED=false, SAMPLE_OK=null;
async function getSample(){ if(SAMPLE_TRIED)return SAMPLE; SAMPLE_TRIED=true; try{SAMPLE=await claude.use("sample");}catch(e){SAMPLE=null;} SAMPLE_OK=!!SAMPLE; return SAMPLE; }
(async()=>{ await getSample(); render(); })();

/* ---------- language + theme ---------- */
const LANGS=["en","ar","both"], THEMES=["auto","light","dark"];
const LANGL={en:"langEn",ar:"langAr",both:"langBoth"}, THL={auto:"themeAuto",light:"themeLight",dark:"themeDark"};
const ico=d=>'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+"</svg>";
const GLOBE=ico('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>');
const SUN=ico('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const MOON=ico('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
const AUTOI=ico('<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>');
const CL=()=>S.lang==="ar"?1:0;
const t=k=>{const v=T[k];return v?v[CL()]:k;};
const pil=p=>T.pillars[p][CL()];
const AR_FMT={"Long-form POV":"مقال رأي مطوّل","Project spotlight":"إضاءة على مشروع","Short-form":"منشور قصير","Poll":"استطلاع","Build note":"ملاحظة بناء","Long-form":"منشور مطوّل","Contrarian short":"رأي مخالف قصير","Story":"قصة","Infographic":"إنفوغرافيك","POV":"وجهة نظر","Data post":"منشور بيانات","Contrarian":"رأي مخالف","Recap + CTA":"خلاصة + دعوة"};
function fmt(f){ if(CL()===0)return f; const m=f.match(/^Carousel · (\d+) slides$/); if(m){const k=+m[1];return "عرض متسلسل · "+k+(k>=3&&k<=10?" شرائح":" شريحة");} return AR_FMT[f]||f; }
/* Arabic pluralises differently from English; "1 فراغات" is simply wrong. */
const gapLabel=g=>CL()===0?(g===1?"1 gap":g+" gaps"):(g===1?"فراغ واحد":g===2?"فراغان":g+" فراغات");
const phLabel=g=>CL()===0?(g===1?"1 placeholder left to fill":g+" placeholders left to fill"):(g===1?"فراغ واحد متبقٍ":g===2?"فراغان متبقيان":g+" فراغات متبقية");
const aud=a=>T.auds[a][CL()];
function applyChrome(){
  document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.documentElement.lang=S.lang==="ar"?"ar":"en";
  const th=S.theme||"auto";
  if(th==="auto"){ if(HOST_THEME)document.documentElement.setAttribute("data-theme",HOST_THEME); else document.documentElement.removeAttribute("data-theme"); }
  else document.documentElement.setAttribute("data-theme",th);
}
function baseOf(key){
  let m;
  if(m=key.match(/^post:(\d+):caption$/)) return {en:byN(m[1]).c, ar:AR_CAPS[+m[1]]||null};
  if(m=key.match(/^post:(\d+):title$/))   return {en:byN(m[1]).t, ar:AR_TITLES[+m[1]-1]||null};
  if(key==="about")   return {en:ABOUT,   ar:AR_ABOUT};
  if(key==="bullets") return {en:BULLETS, ar:AR_BULLETS};
  if(m=key.match(/^headline:(\d+)$/)) return {en:HEADLINES[+m[1]].t, ar:AR_HEADLINES[+m[1]]||null};
  if(m=key.match(/^tpl:(\d+)$/))      return {en:TEMPLATES[+m[1]].s, ar:null};
  return {en:null,ar:null};
}
function txt(key,lang){ const o=S.txt[key]||{}; const v=o[lang]; return (v!=null&&v!=="")?v:baseOf(key)[lang]; }
const isEdited=(key,lang)=>!!(S.txt[key]&&S.txt[key][lang]!=null&&S.txt[key].src===lang);
const isTranslated=(key,lang)=>!!(S.txt[key]&&S.txt[key][lang]!=null&&S.txt[key].src&&S.txt[key].src!==lang);
const titleOf=p=>txt("post:"+p.n+":title",S.lang==="ar"?"ar":"en")||p.t;
const suffixOf=key=>{const m=key.match(/^post:(\d+):caption$/);return m?"\n\n"+byN(m[1]).h.join(" "):"";};

/* ---------- translation ---------- */
function trPrompt(src,from,to){
  const F=from==="ar"?"Arabic":"English", TO=to==="ar"?"Arabic":"English";
  return "Translate the LinkedIn copy below from "+F+" into "+TO+".\n\n"
   +"Context: the author leads people and fleet operations in Dubai, writing about HR, deploying AI to frontline non-desk workers, and electric fleet operations. Register: polished executive thought leadership. The result must read as native LinkedIn copy in "+TO+", not a literal gloss.\n\n"
   +"Rules:\n"
   +"- Reproduce every [[PLACEHOLDER]] token EXACTLY as it appears, in Latin script, unchanged, in the same position.\n"
   +"- Preserve the paragraph structure and every blank line exactly.\n"
   +"- Bullet arrows: use → in English, ← in Arabic.\n"
   +"- Keep proper nouns (Ecosine Transports, Max, Yulisa, LinkedIn, Dubai) correct in the target language.\n"
   +"- Output ONLY the translated text: no preamble, no notes, no surrounding quotation marks.\n\n"
   +"TEXT:\n<<<\n"+src+"\n>>>";
}
async function doTranslate(key,from,to){
  const s=await getSample(); if(!s){toast(t("trUnavail"));return;}
  const src=txt(key,from); if(!src)return;
  TRANS[key+":"+to]=1; render();
  try{
    const out=await s(trPrompt(src,from,to),{modelTier:"default",cache:false});
    let text=String(out&&out.text||"").trim().replace(/^<<<\s*/,"").replace(/\s*>>>$/,"");
    if(!text) throw new Error("empty");
    S.txt[key]=S.txt[key]||{}; S.txt[key][to]=text; S.txt[key].src=from; save();
    delete TRANS[key+":"+to]; render();
    toast(phSet(src)===phSet(text)?t("trDone"):t("phWarn"));
  }catch(e){ delete TRANS[key+":"+to]; render(); toast(t("trFail")); }
}

let tT; function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>el.classList.remove("on"),3200);}
async function copyText(text,label){
  const n=phCount(text);
  if(n&&!confirm(n+" placeholder"+(n>1?"s":"")+" still unfilled in this copy.\n\nCopy anyway?"))return;
  try{await navigator.clipboard.writeText(text);toast(label+" ✓"+(n?" — "+n+" "+t("phLeft"):""));}
  catch(e){toast("Copy blocked by the browser — select the text and copy manually");}
}
function counter(len,lim){const p=len/lim;return '<span class="count '+(p>1?"over":p>.9?"warn":"")+'">'+len.toLocaleString()+" / "+lim.toLocaleString()+" "+t("chars")+"</span>";}

/* ---------- editable bilingual field ---------- */
function pane(key,lang,o){
  const val=txt(key,lang), editing=EDIT&&EDIT.key===key&&EDIT.lang===lang, dir=lang==="ar"?"rtl":"ltr";
  const busy=TRANS[key+":"+lang];
  const label='<div class="pane-label"><b>'+(lang==="ar"?t("arabic"):t("english"))+"</b>"
    +(isEdited(key,lang)?'<span class="edited">'+t("edited")+"</span>":isTranslated(key,lang)?'<span class="edited" style="color:var(--accent-ink)">'+t("trDone")+"</span>":"")
    +(busy?'<span class="tr"><span class="dot-pulse"></span> '+t("translating")+"…</span>":"")+"</div>";
  if(editing) return '<div class="pane">'+label
    +'<textarea class="ed'+(o.short?" short":"")+'" dir="'+dir+'" data-ta="'+key+"|"+lang+'">'+esc(val||"")+"</textarea>"
    +'<div class="row">'+(SAMPLE_OK===false?"":'<button class="btn primary" data-save="'+key+"|"+lang+'|1">'+t("saveTr")+"</button>")
    +'<button class="btn'+(SAMPLE_OK===false?" primary":"")+'" data-save="'+key+"|"+lang+'|0">'+t("save")+"</button>"
    +'<button class="btn" data-canceledit="1">'+t("cancel")+"</button></div></div>";
  if(val==null||val==="") return '<div class="pane">'+label
    +'<div class="empty">'+(lang==="ar"?t("noAr"):t("noEn"))
    +(SAMPLE_OK===false?'<div style="font-size:12.5px;margin-top:6px;opacity:.8">'+t("trUnavail")+"</div>":"")
    +'<div class="row" style="justify-content:center;margin-top:10px">'
    +(SAMPLE_OK===false?"":'<button class="btn" data-tr="'+key+"|"+lang+'">'+t("trThis")+"</button>")
    +'<button class="btn" data-edit="'+key+"|"+lang+'">'+t("edit")+"</button></div></div></div>";
  return '<div class="pane">'+label
    +'<div class="copyblock" dir="'+dir+'"'+(o.short?' style="font-size:15px"':"")+">"+mark(val)+"</div>"
    +'<div class="row"><button class="btn'+(o.primary?" primary":"")+'" data-copykey="'+key+"|"+lang+'">'+(o.copyLabel||t("copyPost"))+"</button>"
    +'<button class="btn" data-edit="'+key+"|"+lang+'">'+t("edit")+"</button>"
    +(o.limit?counter((val+suffixOf(key)).length,o.limit):"")+"</div></div>";
}
function field(key,o){ o=o||{};
  return S.lang==="both" ? '<div class="bi">'+pane(key,"en",o)+pane(key,"ar",o)+"</div>" : pane(key,S.lang,o);
}

/* ---------- views ---------- */
function dayNow(){ if(!S.start)return null; const a=new Date(S.start+"T00:00:00"),b=new Date(); b.setHours(0,0,0,0); return Math.floor((b-a)/86400000)+1; }
const postFor=d=>POSTS.find(p=>p.d===d)||null, nextPost=d=>POSTS.find(p=>p.d>=d)||null;

function vToday(){
  const day=dayNow(), gaps=POSTS.filter(p=>!S.pub[p.n]).reduce((a,p)=>a+phCount(txt("post:"+p.n+":caption","en")),0);

      const g=phCount(txt("post:"+show.n+":caption","en"));

                 :'<div class="meter"><i style="width:100%"></i></div>';

       +'<div class="day-badge">'+(p?t("dueToday"):t("nextUp"))+" · "+t("day")+" "+show.d+" "+t("of")+" 60 · "+t("post")+" "+String(show.n).padStart(2,"0")+"</div>"
       +"<h3>"+esc(titleOf(show))+"</h3>"
       +'<div class="post-meta"><span>'+pil(show.p)+'</span><i class="dot"></i><span>'+aud(show.a)+'</span><i class="dot"></i><span>'+esc(fmt(show.f))+"</span></div>"
       +'<div class="meterbox">'+bar+'<div class="eyebrow" style="color:'+(g?"var(--warn)":"var(--good)")+'">'+(g?phLabel(g):t("readyPub"))+"</div></div>"

    }
  }
  return '<section class="sec"><div class="today-grid">'+hero+'<div class="stack"><div class="metrics">'
   +'<div class="card metric"><div class="k">'+t("day")+'</div><div class="v">'+(day===null?"—":Math.max(0,day))+'<span style="font-size:15px;color:var(--ink-3)"> / 60</span></div></div>'
   +'<div class="card metric"><div class="k">'+t("published")+'</div><div class="v">'+done+'<span style="font-size:15px;color:var(--ink-3)"> / 30</span></div></div>'
   +'<div class="card metric"><div class="k">'+t("postGaps")+'</div><div class="v" style="color:'+(gaps?"var(--warn)":"var(--good)")+'">'+gaps+"</div></div>"
   +'<div class="card metric"><div class="k">'+t("cadence")+'</div><div class="v">48<span style="font-size:15px;color:var(--ink-3)"> '+t("hrs")+"</span></div></div>"
   +'</div><div class="card setup"><label for="sd">'+t("startDate")+'</label><input type="date" id="sd" value="'+(S.start||"")+'"></div>'
   +'<div class="note"><b>'+t("oneRule")+"</b> "+t("oneRuleBody")+"</div></div></div></section>";
}
function card(p){
  const g=phCount(txt("post:"+p.n+":caption","en")), both=S.lang==="both";
  return '<button class="card post'+(S.pub[p.n]?" done":"")+'" style="--pc:'+PILLARS[p.p].c+'" data-open="'+p.n+'">'

function detail(p,closable){
  const g=phCount(txt("post:"+p.n+":caption","en"));
  return '<div class="card detail" style="--pc:'+PILLARS[p.p].c+'">'
   +'<div class="detail-head"><div style="flex:1"><div class="eyebrow" style="color:'+PILLARS[p.p].c+'">'+t("post")+" "+String(p.n).padStart(2,"0")+" · "+t("day")+" "+p.d+" · "+pil(p.p)+" · "+aud(p.a)+" · "+esc(fmt(p.f))+"</div>"

   +(closable?'<button class="btn" data-close="1">'+t("close")+"</button>":"")+"</div>"

   +'<div class="row"><button class="btn" data-pub="'+p.n+'">'+(S.pub[p.n]?t("markUnpub"):t("markPub"))+"</button>"
   +(g?'<span class="eyebrow" style="color:var(--warn)">'+gapLabel(g)+" "+t("phMust")+"</span>":"")+"</div>"
   +'<dl class="kv"><dt>'+t("hashtags")+'</dt><dd class="tag" dir="ltr">'+p.h.join(" ")+"</dd>"
   +"<dt>"+t("media")+"</dt><dd>"+esc(p.m)+"</dd><dt>"+t("cta")+"</dt><dd>"+esc(p.q)+"</dd></dl>"
   +(DRAFT_NOTES[p.n]?'<div class="rationale" dir="ltr"><b>'+T.why[0]+"</b> "+DRAFT_NOTES[p.n]+"</div>":"")
