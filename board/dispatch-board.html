function vCalendar(){
  const chips=[["all",t("all30")]].concat(Object.keys(PILLARS).map(k=>[k,pil(k)]));
  const list=POSTS.filter(p=>(FILT==="all"||p.p===FILT)&&(!HIDE||!S.pub[p.n]));
  return '<section class="sec"><div class="sec-head"><h2>'+t("calendar")+"</h2><p>"+t("calBlurb")+"</p></div>"
   +(SEL?detail(byN(SEL),true):"")
   +'<div class="filters">'+chips.map(c=>'<button class="chip" data-filt="'+c[0]+'" aria-pressed="'+(FILT===c[0])+'">'+c[1]+"</button>").join("")
   +'<button class="chip" data-hide="1" aria-pressed="'+HIDE+'">'+t("hidePub")+"</button></div>"
   +'<div class="board">'+list.map(card).join("")+"</div>"
   +(list.length?"":'<p style="color:var(--ink-3)">'+t("noMatch")+"</p>")+"</section>";
}
function vDrafts(){
  return '<section class="sec"><div class="sec-head"><h2>'+t("draftsH")+"</h2><p>"+t("draftsBlurb")+"</p></div>"
   +'<div class="stack">'+POSTS.slice(0,3).map(p=>detail(p,false)).join("")+"</div></section>";
}
function vProfile(){
  return '<section class="sec"><div class="sec-head"><h2>'+t("profile")+"</h2><p>"+t("profBlurb")+"</p></div>"
  +'<h3 style="font-size:17px;margin-bottom:12px">'+t("headlines")+"</h3><div class=\"stack\">"
  +HEADLINES.map((h,i)=>'<div class="card pad"><div class="post-meta" style="margin-bottom:10px"><span style="color:var(--accent-ink)">'+t("option")+" "+(i+1)+'</span><i class="dot"></i><span dir="ltr">'+h.n+"</span>"+(h.rec?'<span class="gaps">'+t("recommended")+"</span>":"")+"</div>"
    +field("headline:"+i,{short:true,limit:HL,copyLabel:t("copyHl")})
    +'<div class="rationale" dir="ltr">'+h.r+"</div></div>").join("")
  +'</div><div class="note" style="margin-top:14px"><b>'+t("verdict")+"</b> "+t("verdictBody")+"</div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("aboutH")+"</h3>"
  +'<div class="card pad"><p style="color:var(--ink-2);font-size:13.5px;margin-bottom:12px">'+t("aboutNote")+"</p>"
  +field("about",{limit:AB,primary:true,copyLabel:t("copyAbout")})+"</div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("bulletsH")+"</h3>"
  +'<div class="card pad"><p style="color:var(--ink-2);font-size:13.5px;margin-bottom:12px">'+t("bulletsNote")+"</p>"
  +field("bullets",{copyLabel:t("copyBullets")})+"</div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("restH")+"</h3>"
  +'<div class="card scroll"><table dir="ltr"><thead><tr><th>'+T.element[0]+"</th><th>"+T.action[0]+"</th><th>"+T.whyMatters[0]+"</th></tr></thead><tbody>"
  +PROFILE_ROWS.map(r=>"<tr><td><b>"+r[0]+"</b></td><td>"+r[1]+'</td><td style="color:var(--ink-2)">'+r[2]+"</td></tr>").join("")
  +'</tbody></table></div><div class="note" style="margin-top:14px"><b>'+t("stageNote")+"</b> "+t("stageBody")+"</div></section>";
}
function vTemplates(){
  return '<section class="sec"><div class="sec-head"><h2>'+t("templates")+"</h2><p>"+t("tplBlurb")+"</p></div>"
  +'<div class="note" style="margin-bottom:16px"><b>'+t("tplRules")+"</b> "+t("tplRulesBody")+"</div>"
  +'<div class="stack">'+TEMPLATES.map((tp,i)=>'<div class="card pad"><div class="post-meta" style="margin-bottom:8px"><span style="color:var(--accent-ink)" dir="ltr">'+esc(tp.n)+'</span><i class="dot"></i><span dir="ltr">'+tp.len+"</span></div>"
   +'<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:12px" dir="ltr">'+esc(tp.use)+"</p>"
   +field("tpl:"+i,{short:true,copyLabel:t("copySkel")})
   +'<div class="rationale" dir="ltr">'+tp.r+"</div></div>").join("")+"</div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("hookBank")+"</h3>"
  +'<div class="card scroll"><table dir="ltr"><thead><tr><th>'+T.shape[0]+"</th><th>"+T.opening[0]+"</th></tr></thead><tbody>"
  +HOOKS.map(h=>'<tr><td style="white-space:nowrap"><b>'+h[0]+'</b></td><td style="font-family:var(--read);font-size:15px">'+mark(h[1])+"</td></tr>").join("")
  +"</tbody></table></div></section>";
}
function vWorkflow(){
  const groups=Object.keys(CHECKS).map(g=>'<div class="card pad"><h4 dir="ltr">'+g+"</h4>"
    +CHECKS[g].map((c,i)=>{const id=g+"-"+i;return '<label class="check'+(S.chk[id]?" on":"")+'" dir="ltr"><input type="checkbox" data-chk="'+id+'"'+(S.chk[id]?" checked":"")+"><span>"+esc(c)+"</span></label>";}).join("")+"</div>").join("");
  const done=Object.values(S.chk).filter(Boolean).length, tot=Object.values(CHECKS).flat().length;
  return '<section class="sec"><div class="sec-head"><h2>'+t("workflow")+"</h2><p>"+t("wfBlurb")+"</p></div>"
  +'<div class="note" style="margin-bottom:16px"><b>'+t("batch")+"</b> "+t("batchBody")+"</div>"
  +'<div class="row" style="margin:0 0 12px"><span class="eyebrow" id="ckc">'+t("checklist")+" — "+done+" / "+tot+" "+t("ticked")+'</span><button class="btn" data-reset="1" style="margin-inline-start:auto">'+t("reset")+"</button></div>"
  +'<div class="grid2">'+groups+"</div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("pubDay")+"</h3>"
  +'<div class="card pad"><dl class="tl" dir="ltr">'+TIMELINE.map(x=>"<dt>"+x[0]+"</dt><dd>"+x[1]+"</dd>").join("")+"</dl>"
  +'<div class="rationale"><b>'+t("golden")+"</b> "+t("goldenBody")+"</div></div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("dailyH")+"</h3>"
  +'<div class="card pad"><p style="font-size:14px;color:var(--ink-2)">'+t("dailyBody")+"</p>"
  +'<dl class="tl" style="margin-top:12px" dir="ltr"><dt>5 / day</dt><dd>Comment on five posts from your target audiences.</dd>'
  +"<dt>Rule</dt><dd>Every comment must add information the original post did not contain — a counter-example, a number, a distinction. Never “Great insight!”</dd>"
  +"<dt>30–60 wd</dt><dd>Long enough to be substantive, short enough to be read.</dd>"
  +"<dt>~30</dt><dd>Maintain a target list of about thirty accounts and engage with the same people repeatedly. Recognition compounds.</dd>"
  +"<dt>24 hrs</dt><dd>Answer every DM within a day, even if the answer is “not right now”.</dd></dl>"
  +'<div class="rationale">'+t("headlineNote")+"</div></div>"
  +'<h3 style="font-size:17px;margin:28px 0 12px">'+t("analytics")+"</h3>"
  +'<div class="card scroll"><table dir="ltr"><thead><tr><th>'+T.metric[0]+"</th><th>"+T.target60[0]+"</th><th>"+T.whyCol[0]+"</th></tr></thead><tbody>"
  +METRICS.map(m=>"<tr"+(m[3]?"":' style="opacity:.6"')+"><td><b>"+m[0]+"</b>"+(m[3]?"":' <span class="eyebrow" style="color:var(--crit)">'+T.ignore[0]+"</span>")+'</td><td class="num">'+m[1]+'</td><td style="color:var(--ink-2)">'+m[2]+"</td></tr>").join("")
  +'</tbody></table></div><div class="note" style="margin-top:14px"><b>'+t("judge")+"</b> "+t("judgeBody")+"</div></section>";
}

const VIEWS={today:["today",vToday],calendar:["calendar",vCalendar],drafts:["drafts",vDrafts],profile:["profile",vProfile],templates:["templates",vTemplates],workflow:["workflow",vWorkflow]};
function render(){
  applyChrome();
  $("#brandname").textContent=t("board");
  $("#tabs").innerHTML=Object.keys(VIEWS).map(k=>'<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(TAB===k)+'">'+t(VIEWS[k][0])+"</button>").join("");
  const th=S.theme||"auto";
  $("#switches").innerHTML='<div class="sw only-wide">'
   +'<div class="lang" role="group" aria-label="Language">'+LANGS.map(l=>'<button data-lang="'+l+'" aria-pressed="'+(S.lang===l)+'">'+t(LANGL[l])+"</button>").join("")+"</div>"
   +'<div class="lang" role="group" aria-label="Theme">'+THEMES.map(l=>'<button data-th="'+l+'" aria-pressed="'+(th===l)+'">'+t(THL[l])+"</button>").join("")+"</div></div>"
   +'<div class="sw only-narrow">'
   +'<button class="cyc" data-langcycle="1" aria-label="Language">'+GLOBE+t(LANGL[S.lang])+"</button>"
   +'<button class="cyc" data-thcycle="1" aria-label="Theme">'+(th==="dark"?MOON:th==="light"?SUN:AUTOI)+t(THL[th])+"</button></div>";
  $("#app").innerHTML=VIEWS[TAB][1]();
  const day=dayNow();
  $("#cadence").textContent=day===null?t("posts60"):t("day")+" "+Math.max(0,day)+" · "+POSTS.filter(p=>S.pub[p.n]).length+"/30";
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-lang],[data-th],[data-langcycle],[data-thcycle],[data-open],[data-close],[data-filt],[data-hide],[data-copykey],[data-pub],[data-reset],[data-edit],[data-save],[data-canceledit],[data-tr]");
  if(!b)return; const d=b.dataset;
  if(d.tab){TAB=d.tab;SEL=null;EDIT=null;render();window.scrollTo({top:0,behavior:"smooth"});return;}
  if(d.lang){S.lang=d.lang;EDIT=null;save();render();return;}
  if(d.langcycle){S.lang=LANGS[(LANGS.indexOf(S.lang)+1)%3];EDIT=null;save();render();return;}
  if(d.thcycle){S.theme=THEMES[(THEMES.indexOf(S.theme||"auto")+1)%3];save();render();return;}
  if(d.th){S.theme=d.th;save();render();return;}
  if(d.open){SEL=+d.open;TAB="calendar";EDIT=null;render();const el=$(".detail");if(el)el.scrollIntoView({block:"start",behavior:"smooth"});return;}
  if(d.close){SEL=null;render();return;}
  if(d.filt){FILT=d.filt;SEL=null;render();return;}
  if(d.hide){HIDE=!HIDE;render();return;}
  if(d.pub){S.pub[d.pub]=!S.pub[d.pub];save();render();return;}
  if(d.reset){S.chk={};save();render();toast(t("reset"));return;}
  if(d.edit){const[k,l]=d.edit.split("|");EDIT={key:k,lang:l};render();const ta=$('[data-ta="'+k+"|"+l+'"]');if(ta){ta.focus();ta.scrollIntoView({block:"center",behavior:"smooth"});}return;}
  if(d.canceledit){EDIT=null;render();return;}
  if(d.save){const[k,l,tr]=d.save.split("|");const ta=$('[data-ta="'+k+"|"+l+'"]');if(!ta)return;
    S.txt[k]=S.txt[k]||{};S.txt[k][l]=ta.value;S.txt[k].src=l;save();EDIT=null;render();toast(t("saved"));
    if(tr==="1")doTranslate(k,l,l==="ar"?"en":"ar");return;}
  if(d.tr){const[k,l]=d.tr.split("|");doTranslate(k,l==="ar"?"en":"ar",l);return;}
  if(d.copykey){const[k,l]=d.copykey.split("|");const v=txt(k,l);if(v)copyText(v+suffixOf(k),b.textContent.trim());return;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sd"){S.start=e.target.value;save();render();return;}
  if(e.target.dataset.chk){S.chk[e.target.dataset.chk]=e.target.checked;save();
    e.target.closest(".check").classList.toggle("on",e.target.checked);
    const done=Object.values(S.chk).filter(Boolean).length,tot=Object.values(CHECKS).flat().length;
    const el=$("#ckc");if(el)el.textContent=t("checklist")+" — "+done+" / "+tot+" "+t("ticked");}
});
render();
</script>
